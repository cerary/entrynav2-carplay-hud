# Persistent drop-in (/etc/systemd/system/CARPLAY.service.d/hud-shim.conf)
# Includes a 3-crash boot-loop guard: if CARPLAY restarts >= 3 times within one boot,
# it automatically drops LD_PRELOAD and falls back to stock CARPLAY.
[Service]
ExecStart=
ExecStart=/bin/sh -c 'n=$(wc -l < /tmp/.hud_shim_tries 2>/dev/null | tr -d " \n" || echo 0); case "$n" in ""|*[!0-9]*) n=0 ;; esac; if [ "$n" -lt 3 ] && [ -f /opt/hud-port/carplay-shim.so ] && [ -S /tmp/carplay_rgd.sock ]; then echo 1 >> /tmp/.hud_shim_tries; LD_PRELOAD=/opt/hud-port/carplay-shim.so exec /usr/local/bin/CARPLAY; fi; exec /usr/local/bin/CARPLAY'
